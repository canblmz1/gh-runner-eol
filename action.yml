name: "Runner EOL Guard"
description: "Early warning for GitHub self-hosted runners that will stop receiving jobs. Reconciles live runners, pinned source versions and GitHub's official EOL schedule."
author: "canblmz1"
branding:
  icon: "alert-triangle"
  color: "orange"

inputs:
  mode:
    description: "audit = live runners + pinned source (needs a token that can read runners). scan = pinned source only; EOL dates are still resolved if the token allows, otherwise reported as unknown."
    required: false
    default: "audit"
  target:
    description: "ORG, OWNER/REPO or enterprise:SLUG to audit. Defaults to the current repository's owner organization."
    required: false
    default: ${{ github.repository_owner }}
  token:
    description: "Token with 'Self-hosted runners: read' (org/enterprise) or 'Administration: read' (repo) on the target. The workflow GITHUB_TOKEN cannot read runners; use a fine-grained PAT or GitHub App token for mode=audit."
    required: false
    default: ${{ github.token }}
  scan:
    description: "Directory to scan for pinned runner versions (Dockerfile, ARC Helm values, scripts). Empty disables scanning."
    required: false
    default: "."
  warn-days:
    description: "Flag versions whose runtime support ends within this many days."
    required: false
    default: "14"
  fail-on:
    description: "Fail the step when any finding is at least this severe: overdue, warning, unknown, none."
    required: false
    default: "overdue"
  format:
    description: "Output format written to `output`: sarif, json or table."
    required: false
    default: "sarif"
  output:
    description: "Path of the report file."
    required: false
    default: "runner-eol.sarif"
  version:
    description: "checkout = build the exact commit of this Action (default, reproducible). Or a release tag (v0.1.2) / 'latest' to install a GitHub Release binary instead."
    required: false
    default: "checkout"

outputs:
  report:
    description: "Path to the generated report file (upload with github/codeql-action/upload-sarif when format=sarif)."
    value: ${{ steps.run.outputs.report }}
  exit-code:
    description: "0 = clean, 1 = findings crossed fail-on, 2 = error."
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      if: ${{ inputs.version == 'checkout' }}
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: true

    - name: Install runner-eol
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        # action_repository is empty when the action is used via `uses: ./`
        EXT_REPO: ${{ github.action_repository || 'canblmz1/gh-runner-eol' }}
        EXT_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        if [ "$EXT_VERSION" = "checkout" ]; then
          action_path="$(cd "$ACTION_PATH" && pwd)"
          version="${ACTION_REF:-dev}"
          version="${version#v}"
          case "$version" in
            main|master|HEAD|"") version=dev ;;
          esac
          # Build the tree this workflow invoked — same commit as action.yml.
          # gh extension install only accepts OWNER/REPO, so drop the binary
          # into the local extensions dir ourselves.
          ( cd "$action_path" && go build -trimpath -ldflags="-s -w -X main.version=${version}" -o gh-runner-eol . )
          ext_dir="${XDG_DATA_HOME:-$HOME/.local/share}/gh/extensions/gh-runner-eol"
          mkdir -p "$ext_dir"
          cp "$action_path/gh-runner-eol" "$ext_dir/gh-runner-eol"
          chmod +x "$ext_dir/gh-runner-eol"
        elif [ "$EXT_VERSION" = "latest" ]; then
          gh extension install "$EXT_REPO"
        else
          gh extension install "$EXT_REPO" --pin "$EXT_VERSION"
        fi
        gh runner-eol --version

    - name: Audit runner fleet
      id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        MODE: ${{ inputs.mode }}
        TARGET: ${{ inputs.target }}
        SCAN: ${{ inputs.scan }}
        WARN_DAYS: ${{ inputs.warn-days }}
        FAIL_ON: ${{ inputs.fail-on }}
        FORMAT: ${{ inputs.format }}
        OUTPUT: ${{ inputs.output }}
      run: |
        set -uo pipefail
        common=(--warn-days "$WARN_DAYS" --fail-on "$FAIL_ON")
        case "$TARGET" in
          enterprise:*) scope=(--enterprise "${TARGET#enterprise:}") ;;
          */*)          scope=(--repo "$TARGET") ;;
          *)            scope=(--org "$TARGET") ;;
        esac
        if [ "$MODE" = "scan" ]; then
          args=(scan "${SCAN:-.}" "${scope[@]}" "${common[@]}")
        else
          args=(audit "$TARGET" "${common[@]}")
          if [ -n "$SCAN" ]; then args+=(--scan "$SCAN"); fi
        fi

        gh runner-eol "${args[@]}" --format "$FORMAT" --output "$OUTPUT"
        code=$?
        echo "report=$OUTPUT" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

        {
          echo '### runner-eol'
          echo '```'
          gh runner-eol "${args[@]}" --fail-on none --no-color 2>&1
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY" || true
        exit $code
