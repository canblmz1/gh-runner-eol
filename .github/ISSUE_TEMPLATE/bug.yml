name: Bug report
description: "Something is wrong with audit / check / scan output or exit codes"
labels: ["bug"]
body:
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: Include `--format json` output if possible. Redact runner names.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: Scope
      placeholder: "org / repo / enterprise, github.com or GHEC data residency"
  - type: input
    id: version
    attributes:
      label: runner-eol version
      placeholder: "output of: gh runner-eol --version"
