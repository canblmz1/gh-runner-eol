name: Runner EOL (weekly)

# Example consumer workflow. Copy this into any repo that owns self-hosted
# runners or pins a runner image.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  runner-eol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        id: eol
        with:
          # With a PAT/App token in RUNNER_EOL_TOKEN this audits live runners too;
          # without one it falls back to scanning pinned source only.
          mode: ${{ secrets.RUNNER_EOL_TOKEN && 'audit' || 'scan' }}
          target: ${{ github.repository }}
          token: ${{ secrets.RUNNER_EOL_TOKEN || github.token }}
          scan: .
          fail-on: none
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.eol.outputs.report != ''
        with:
          sarif_file: ${{ steps.eol.outputs.report }}
